version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL_PRIMARY=${GROQ_MODEL_PRIMARY:-llama3-70b-8192}
      - GROQ_MODEL_FALLBACK=${GROQ_MODEL_FALLBACK:-mixtral-8x7b-32768}
      - MAX_CLAIMS=${MAX_CLAIMS:-10}
      - SEARCH_RESULTS_PER_CLAIM=${SEARCH_RESULTS_PER_CLAIM:-4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
      - API_TIMEOUT=120
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    driver: bridge
